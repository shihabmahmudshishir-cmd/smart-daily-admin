<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Daily BD Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5f9;color:#172554}
header{background:#172554;color:white;padding:22px}
header h2{margin:0}
main{padding:18px;max-width:900px;margin:auto}
h2{margin-top:20px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px #ddd}
.card h3{font-size:15px;color:#64748b}
.card p{font-size:25px;font-weight:bold;margin:8px 0}
button{background:#172554;color:white;border:0;padding:13px;border-radius:8px;width:100%;margin-top:10px;font-size:15px}
</style>
</head>
<body>
<header>
<h2>SMART DAILY BD</h2>
<p>OWNER ADMIN PANEL</p>
</header>
<main>
<h2>Dashboard</h2>
<div class="cards">
<div class="card"><h3>Total Users</h3><p>—</p></div>
<div class="card"><h3>Premium Users</h3><p>—</p></div>
<div class="card"><h3>Total Income</h3><p>৳0</p></div>
<div class="card"><h3>App Status</h3><p>Active</p></div>
</div>
<h2>App Management</h2>
<div class="card">
<button onclick="alert('Firebase connection will be added next')">Feature Management</button>
<button onclick="alert('Firebase connection will be added next')">User Management</button>
<button onclick="alert('Firebase connection will be added next')">Premium Management</button>
<button onclick="alert('Firebase connection will be added next')">Advertisement Settings</button>
<button onclick="alert('Firebase connection will be added next')">App Notice</button>
</div>
</main>
</body>
</html>
